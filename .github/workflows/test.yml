# The unit suite — the gate that did not exist until issue #89.
#
# Before this file, `.github/workflows/` ran exactly ONE test file
# (agent-shell-harness.test.cjs, and only on a path filter). `npm test` — 3,248
# tests — was never executed by CI, so every green tick on every PR merged into
# this repo to date said nothing whatsoever about the unit suite. Those merges
# remain unverified at this layer; the clock starts here, it does not
# retroactively cover them.
#
# Three properties this job is built to hold:
#
#   1. NO PATH FILTER. The harness workflow is path-filtered, which is a known
#      false-green class in this fleet. This job runs on every pull request and
#      on every push to main, so "the job did not run" can never read as "the
#      job passed" for any tree that can reach main.
#
#   2. IT CANNOT PASS BY NOT RUNNING. `node --test` exits 0 when its file
#      patterns match nothing. scripts/ci-unit-gate.cjs asserts floors on the
#      number of tests AND the number of distinct test files, and fails when the
#      reporter produced no output at all.
#
#   3. THE GATE IS ITSELF GATED. The gate's own tests run first, as their own
#      step, before the suite it guards — a broken gate fails loudly rather than
#      waving the suite through. They are also inside `npm test`, so a change to
#      the gate is checked twice.
#
# OUT OF BAND: this job must be added to branch protection as a REQUIRED check.
# That is a repo setting, not a file in this tree. Until it is set, a PR can
# still merge with this job red.
name: Unit suite

# `push:` unqualified plus `pull_request:` runs this ~3-minute, 3,300-test job
# TWICE for every PR push, on two separate runners, and the concurrency group
# cannot dedupe them because github.ref differs (refs/heads/<branch> vs
# refs/pull/N/merge). Measured on this very PR: every SHA carried both a push run
# and a pull_request run. Worse than the waste, the pair can DISAGREE — runs
# 35902475340 (push) and 35902484923 (pull_request) on the same SHA 9a0b374a,
# four seconds apart, reported 31 vs 34 skipped and PASS vs FAIL, because
# ubuntu-latest's pwsh availability moved between them. Two verdicts on one tree
# is not twice the confidence; it is none.
#
# Restricting push to main keeps the guarantee intact: a PR is covered by the
# pull_request event, and the merge commit on main is covered by the push event.
# Nothing that can reach main goes unrun.
on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing about the tip; do not spend a runner on it.
concurrency:
  group: unit-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (npm test, gated)
    runs-on: ubuntu-latest
    # MEASURED on this runner (run 35893407704, the green run of this PR):
    # checkout 1s, setup-node 1s, `npm ci` 7s with the npm cache warm, gate
    # self-test <1s, the suite itself 181s — 3m17s for the whole job. The
    # preamble is ~15s, so the gate's own 22-minute SUITE_TIMEOUT_MS fires around
    # 22m15s into the job and this ceiling is never the thing that stops it. That
    # ordering is deliberate: the internal timeout prints which file it died in,
    # a GitHub-level timeout prints nothing. Keep this ceiling above the internal
    # one, with room for a cold npm cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 26, not 22 or 24 (#101): a describe-scoped after() hook that throws exits 0
          # with no <failure> on node 22.23.3 and 24.13.1 — both channels silent, so the
          # gate cannot see it. node 25.9.0 / 26.10.0 exit 1, which Guard 0 catches.
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run the gate's own tests BEFORE the gate runs the suite. If the gate's
      # parsing, floors or allowlist ratchet are broken, that is a failure of the
      # check itself and must not be reported as a suite result.
      - name: Gate self-test
        run: node --test scripts/ci-unit-gate.test.cjs

      # Fails on: any undeclared test failure; any allowlist entry that passed
      # (the list may only shrink); a suite that matched too few tests or files;
      # or a runner that produced no report.
      - name: Run the unit suite
        run: node scripts/ci-unit-gate.cjs

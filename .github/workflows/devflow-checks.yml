# DevFlow required checks and merge-time reconcile - reusable workflow (objective 50, GEN-05).
#
# Called from the small managed workflow `df-tools gh setup` writes into every repository
# (plugins/devflow/devflow/templates/github/devflow.yml). It runs three jobs against the
# DevFlow check runner, `plugins/devflow/devflow/bin/lib/gh-check-cli.cjs`:
#
#   linked-issue          the PR (or the merge-queue entry) must carry a closing reference
#   planning-consistency  in store mode, the PR must close the objective issue and its TRDs
#   reconcile             on a MERGED pull request, close every closing target the merge left open
#
# STATUS CONTEXTS ARE POSTED BY THE SCRIPT, NOT INFERRED FROM JOB NAMES. The runner posts the
# commit statuses `devflow/linked-issue` and `devflow/planning-consistency` itself. A required
# status rule matches a context by name whatever workflow or job produced it, so nesting this
# workflow through `workflow_call` (where a job is reported as `<caller job> / <called job>`)
# cannot break the match, and renaming a job here cannot silently unprotect a branch. The jobs
# also exit non-zero on a failing check, for visibility in the Actions UI.
#
# TOKENS.
#   * No App configured (`app-client-id` empty): GITHUB_TOKEN. The caller grants it
#     `contents: read, pull-requests: read, issues: write, statuses: write`, which is enough to
#     read the PR, post statuses and close issues. This is the smaller blast radius; the checks
#     themselves never REQUIRE an App.
#   * App configured: `actions/create-github-app-token@v3`, authenticating with `client-id`
#     (the `app-id` input is deprecated and is deliberately not used). Every App step is
#     conditional on the input, and lists explicit `permission-*` inputs so the token is never
#     the App's full grant. Two tokens are minted per job: `app` for the caller repository (used
#     for status posting and reconcile), and `app-src` for the DevFlow repository (used only to
#     check out the runner script, so a private DevFlow repo works).
#   * Posting uses `steps.app.outputs.token || github.token`.
#
# NO `paths`, `paths-ignore` OR `branches` FILTERS, here or in the caller. A required check that
# a filter prevents from running never reports, and the merge hangs on "expected".
#
# `pull_request_target` is not used: the checks only read PR metadata and never execute PR code.
name: DevFlow checks

on:
  workflow_call:
    inputs:
      devflow-ref:
        description: Ref of the DevFlow repository that supplies the check runner script.
        type: string
        required: true
      devflow-repo:
        description: The DevFlow repository (owner/name) the runner script is checked out from.
        type: string
        required: false
        default: AO-Cyber-Systems/devflow-claude
      app-client-id:
        description: Client ID of the DevFlow GitHub App. Empty means use GITHUB_TOKEN.
        type: string
        required: false
        default: ''
    secrets:
      app-private-key:
        description: Private key of the DevFlow GitHub App. Only read when app-client-id is set.
        required: false

jobs:
  linked-issue:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
      - name: Mint the DevFlow App token for this repository
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
          permission-issues: write
          permission-pull-requests: read
          permission-contents: read

      - name: Resolve the DevFlow repository owner and name
        id: src
        if: inputs.app-client-id != ''
        env:
          DEVFLOW_REPO: ${{ inputs.devflow-repo }}
        run: |
          echo "owner=${DEVFLOW_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DEVFLOW_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a read-only App token for the DevFlow repository
        id: app-src
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.src.outputs.owner }}
          repositories: ${{ steps.src.outputs.name }}
          permission-contents: read

      - name: Check out the DevFlow check runner
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devflow-repo }}
          ref: ${{ inputs.devflow-ref }}
          path: .devflow
          sparse-checkout: plugins/devflow/devflow/bin
          token: ${{ steps.app-src.outputs.token || github.token }}
          persist-credentials: false

      - name: Check that the pull request closes an issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DEVFLOW_GH_CACHE_DIR: ${{ runner.temp }}/devflow
        run: node .devflow/plugins/devflow/devflow/bin/lib/gh-check-cli.cjs linked-issue

  planning-consistency:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
      - name: Mint the DevFlow App token for this repository
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
          permission-issues: write
          permission-pull-requests: read
          permission-contents: read

      - name: Resolve the DevFlow repository owner and name
        id: src
        if: inputs.app-client-id != ''
        env:
          DEVFLOW_REPO: ${{ inputs.devflow-repo }}
        run: |
          echo "owner=${DEVFLOW_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DEVFLOW_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a read-only App token for the DevFlow repository
        id: app-src
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.src.outputs.owner }}
          repositories: ${{ steps.src.outputs.name }}
          permission-contents: read

      - name: Check out the DevFlow check runner
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devflow-repo }}
          ref: ${{ inputs.devflow-ref }}
          path: .devflow
          sparse-checkout: plugins/devflow/devflow/bin
          token: ${{ steps.app-src.outputs.token || github.token }}
          persist-credentials: false

      - name: Check that the pull request matches the objective's planning
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DEVFLOW_GH_CACHE_DIR: ${{ runner.temp }}/devflow
        run: node .devflow/plugins/devflow/devflow/bin/lib/gh-check-cli.cjs planning-consistency

  reconcile:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
      - name: Mint the DevFlow App token for this repository
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
          permission-issues: write
          permission-pull-requests: read
          permission-contents: read

      - name: Resolve the DevFlow repository owner and name
        id: src
        if: inputs.app-client-id != ''
        env:
          DEVFLOW_REPO: ${{ inputs.devflow-repo }}
        run: |
          echo "owner=${DEVFLOW_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DEVFLOW_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a read-only App token for the DevFlow repository
        id: app-src
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.src.outputs.owner }}
          repositories: ${{ steps.src.outputs.name }}
          permission-contents: read

      - name: Check out the DevFlow check runner
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.devflow-repo }}
          ref: ${{ inputs.devflow-ref }}
          path: .devflow
          sparse-checkout: plugins/devflow/devflow/bin
          token: ${{ steps.app-src.outputs.token || github.token }}
          persist-credentials: false

      - name: Close the issues the merge left open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          DEVFLOW_GH_CACHE_DIR: ${{ runner.temp }}/devflow
        run: node .devflow/plugins/devflow/devflow/bin/lib/gh-check-cli.cjs reconcile

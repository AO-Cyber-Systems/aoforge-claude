# The agent shell harness (TRD 34-09/34-10) runs the fenced bash of the named sections of
# `plugins/aoforge-stack-flutter/fragments/executor.md` (the Flutter stack pack's executor
# procedure, moved out of agents/executor.md by TRD 76-05 and objective 77) under the real Bash-tool model — cwd persists,
# shell variables do not, one command per call — and fails on any finding.
#
# This job is PATH-FILTERED, which is a known false-green class in this fleet
# (fleet memory: path-filtered-ci-hides-red). One mitigation and one deliberate choice:
#   1. the filter includes this workflow's own path and the harness's own sources, so a
#      PR that weakens the gate re-runs the gate;
#   2. the job is deliberately NOT a required check. The ruleset `aoforge: default branch`
#      (.github/rulesets/main.json, objective 74) requires only the unit suite: a required
#      check that the path filter skips never reports, and GitHub would hold every other
#      PR waiting for it. A red run here shows on the PR but does not block its merge.
name: Agent shell harness

on:
  pull_request:
    paths:
      - 'plugins/aoforge/agents/**'
      - 'plugins/aoforge/aoforge/workflows/**'
      - 'plugins/aoforge-stack-flutter/fragments/**'
      - 'plugins/aoforge-stack-flutter/bin/**'
      - 'plugins/aoforge/aoforge/bin/lib/agent-shell-harness*'
      - 'plugins/aoforge/aoforge/bin/lib/__fixtures__/agent-shell/**'
      - '.github/workflows/agent-shell-harness.yml'

# Least privilege (CodeQL actions/missing-workflow-permissions): this job checks out the tree and runs
# the harness. It writes nothing through GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      # The stub binaries are reached through a prepended PATH. If the checkout lost the
      # executable bit, every section would report MISSING rather than pass — but only
      # after a confusing run, so check the fixture mode up front and fail loudly.
      - name: Stub binaries are executable
        run: |
          git ls-files -s plugins/aoforge/aoforge/bin/lib/__fixtures__/agent-shell/bin/
          test "$(git ls-files -s plugins/aoforge/aoforge/bin/lib/__fixtures__/agent-shell/bin/ | grep -c '^100755')" -eq 7

      # Nothing swallows this step's exit code: a finding must fail the job.
      - name: Run the harness against the executor's Flutter procedure
        run: node --test plugins/aoforge/aoforge/bin/lib/agent-shell-harness.test.cjs

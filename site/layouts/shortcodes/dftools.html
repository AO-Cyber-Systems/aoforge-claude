{{- $d := site.Data.aoforge -}}
<div class="table-wrap">
<table>
  <thead><tr><th>Command</th><th>Subcommands</th></tr></thead>
  <tbody>
  {{- range $d.dfTools }}
    <tr>
      <td><code>{{ .command }}</code></td>
      <td>
        {{- if .subcommands -}}
          {{- range .subcommands }}<code>{{ . }}</code> {{ end -}}
        {{- else -}}
          <span style="color:var(--text-muted)">—</span>
        {{- end -}}
      </td>
    </tr>
  {{- end }}
  </tbody>
</table>
</div>
